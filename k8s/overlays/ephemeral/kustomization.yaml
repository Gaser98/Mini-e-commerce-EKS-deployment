# Used by ephemeral PR environments.
# The namespace is set at deploy time by CI via:
#   kubectl apply -n pr-{N} -f <(kustomize build k8s/overlays/ephemeral)
# Namespace is NOT hardcoded here — CI passes it with -n flag.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: 776235864987.dkr.ecr.us-east-1.amazonaws.com/ecommerce-api
    newTag: latest   # replaced by kustomize edit set image in CI

patches:
  - path: patch-replicas.yaml
  - path: patch-secret-store.yaml
