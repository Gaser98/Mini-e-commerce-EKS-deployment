# Points the ExternalSecret at the production secrets path
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api-secrets
spec:
  data:
    - secretKey: database_url
      remoteRef:
        key: ecommerce/production/rds
        property: connection_string
    - secretKey: jwt_secret
      remoteRef:
        key: ecommerce/production/jwt
        property: jwt_secret
