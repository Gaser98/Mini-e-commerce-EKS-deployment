apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  # eks.amazonaws.com/role-arn tells the EKS pod identity webhook to inject
  # AWS_ROLE_ARN and AWS_WEB_IDENTITY_TOKEN_FILE into every pod using this SA.
  # The Go AWS SDK picks those up automatically — no credentials in env vars.
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::776235864987:role/api-irsa-role
