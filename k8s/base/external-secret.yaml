# External Secrets Operator reads from AWS Secrets Manager and creates the K8s Secret
# that the Deployment mounts. Rotation is automatic: ESO re-reads every refreshInterval.
#
# Requires External Secrets Operator installed on the cluster:
#   helm repo add external-secrets https://charts.external-secrets.io
#   helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: api   # This SA has IRSA — no static credentials
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: api-secrets    # Creates the K8s Secret referenced in deployment.yaml
    creationPolicy: Owner
  data:
    - secretKey: database_url
      remoteRef:
        key: ecommerce/NAMESPACE_PLACEHOLDER/rds  # Patched per overlay
        property: connection_string
    - secretKey: jwt_secret
      remoteRef:
        key: ecommerce/NAMESPACE_PLACEHOLDER/jwt
        property: jwt_secret
