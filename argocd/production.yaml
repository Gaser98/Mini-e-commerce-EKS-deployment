apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecommerce-api-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/Gaser98/db-design-project.git
    targetRevision: main
    path: helm/ecommerce-api
    helm:
      valueFiles:
        - values.yaml
        - values-production.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: production

  syncPolicy:
    # Production is NOT automated — sync is triggered manually in the ArgoCD UI.
    # This is the approval gate: a human reviews staging, then clicks Sync.
    automated: null
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
