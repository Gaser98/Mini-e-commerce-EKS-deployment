name: CI — Test, Build, Ephemeral Deploy

on:
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 776235864987.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPO: ecommerce-api
  EKS_CLUSTER: ecommerce-eks

# Request the OIDC token GitHub embeds in the workflow — required for aws-actions/configure-aws-credentials
permissions:
  id-token: write
  contents: read
  pull-requests: write  # needed to post preview URL comment

jobs:
  # ── 1. Unit tests + lint ──────────────────────────────────────────────────
  test:
    name: Unit tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: go test ./... -race -count=1 -timeout=120s

      - name: Run linter
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  # ── 2. Integration tests (real Postgres) ──────────────────────────────────
  integration-test:
    name: Integration tests
    runs-on: ubuntu-latest
    # Spin up a real Postgres container alongside the job
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ecommerce_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgres://testuser:testpass@localhost:5432/ecommerce_test?sslmode=disable
          JWT_SECRET: integration-test-secret
        run: go test -tags=integration ./internal/api/ -v -count=1 -timeout=60s

  # ── 3. Build, scan, and push image ────────────────────────────────────────
  build-push:
    name: Build and push Docker image
    needs: [test, integration-test]
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ github.sha }}
      image-uri: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC — no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::776235864987:role/github-actions-ecommerce
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local, for scanning)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false       # don't push yet — scan first
          load: true        # load into local Docker daemon for Trivy
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ github.sha }}
          format: table
          exit-code: 1         # fail the pipeline on CRITICAL or HIGH CVEs
          severity: CRITICAL,HIGH
          ignore-unfixed: true  # only fail on CVEs that have a fix available

      - name: Push image (only if scan passed)
        run: |
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ github.sha }}

  # ── 3. Deploy ephemeral namespace ─────────────────────────────────────────
  deploy-ephemeral:
    name: Deploy to pr-${{ github.event.number }} namespace
    needs: build-push
    runs-on: ubuntu-latest
    environment: ephemeral   # creates an audit trail in GitHub Environments
    env:
      PR_NAMESPACE: pr-${{ github.event.number }}
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl + kustomize
        uses: azure/setup-kubectl@v4
      - run: curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
        shell: bash

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::776235864987:role/github-actions-ecommerce
          aws-region: ${{ env.AWS_REGION }}

      - name: Generate kubeconfig from EKS
        # aws eks update-kubeconfig writes ~/.kube/config with an exec plugin.
        # Each kubectl call then calls "aws eks get-token" to get a short-lived token.
        # No long-lived kubeconfig is stored anywhere.
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER }} \
            --region ${{ env.AWS_REGION }}

      - name: Create isolated namespace
        run: |
          kubectl create namespace ${{ env.PR_NAMESPACE }} --dry-run=client -o yaml \
            | kubectl apply -f -
          kubectl label namespace ${{ env.PR_NAMESPACE }} \
            ephemeral=true \
            pr="${{ github.event.number }}" \
            --overwrite

      - name: Render and validate manifests
        run: |
          cd k8s/overlays/ephemeral
          kustomize edit set image \
            776235864987.dkr.ecr.us-east-1.amazonaws.com/ecommerce-api=${{ needs.build-push.outputs.image-uri }}
          kustomize build . | kubectl apply --dry-run=server -n ${{ env.PR_NAMESPACE }} -f -

      - name: Deploy
        run: |
          cd k8s/overlays/ephemeral
          kustomize edit set image \
            776235864987.dkr.ecr.us-east-1.amazonaws.com/ecommerce-api=${{ needs.build-push.outputs.image-uri }}
          kustomize build . | kubectl apply -n ${{ env.PR_NAMESPACE }} -f -

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/ecommerce-api \
            -n ${{ env.PR_NAMESPACE }} \
            --timeout=120s

      - name: Post preview URL to PR
        run: |
          LB=$(kubectl get svc ecommerce-api -n ${{ env.PR_NAMESPACE }} \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "pending")
          gh pr comment ${{ github.event.number }} --body \
            "**Ephemeral preview** \`${{ env.PR_NAMESPACE }}\` deployed.
            URL: http://${LB}
            Image: \`${{ github.sha }}\`
            Namespace is destroyed automatically when this PR closes."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
