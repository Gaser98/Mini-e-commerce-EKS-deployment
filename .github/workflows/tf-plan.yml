name: Terraform Plan

# Only runs when Infra/ files change in a PR — keeps plan output in the PR for review.
on:
  pull_request:
    branches: [main]
    paths:
      - "Infra/**"
      - "!Infra/bootstrap/**"   # bootstrap is applied manually, never by CI

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    name: terraform plan (${{ github.head_ref }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Infra

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::776235864987:role/github-actions-ecommerce
          aws-region: us-east-1

      - name: terraform init
        run: terraform init

      - name: terraform fmt check
        run: terraform fmt -check -recursive

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        id: plan
        # Use the PR number as workspace so plan is isolated from staging/production
        run: |
          terraform workspace select pr-${{ github.event.number }} 2>/dev/null \
            || terraform workspace new pr-${{ github.event.number }}
          terraform plan -no-color -out=tfplan 2>&1 | tee plan.txt
        continue-on-error: true

      - name: Post plan to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('Infra/plan.txt', 'utf8');
            const truncated = plan.length > 60000
              ? plan.substring(0, 60000) + '\n... (truncated)'
              : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Terraform Plan\n\`\`\`hcl\n${truncated}\n\`\`\``
            });

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1
