name: CD — Build, push, and update image tag

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 776235864987.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPO: ecommerce-api

permissions:
  id-token: write
  contents: write  # needed to commit the updated image tag back to the repo

jobs:
  # ── 1. Build and push ────────────────────────────────────────────────────────
  build-push:
    name: Build and push
    runs-on: ubuntu-latest
    outputs:
      image-uri: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::776235864987:role/github-actions-ecommerce
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2. Update staging values file (ArgoCD auto-syncs from this) ──────────────
  update-staging-tag:
    name: Update staging image tag
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Use a token with contents:write — GITHUB_TOKEN works if Actions has write access
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch values-staging.yaml with new image tag
        run: |
          sed -i "s|^  tag:.*|  tag: ${{ github.sha }}|" helm/ecommerce-api/values-staging.yaml

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/ecommerce-api/values-staging.yaml
          git diff --cached --quiet && echo "No tag change, skipping commit" && exit 0
          git commit -m "chore: update staging image tag to ${{ github.sha }}"
          git push

  # ── Note on production ───────────────────────────────────────────────────────
  # Production is promoted manually:
  #   1. Verify staging looks healthy in ArgoCD UI or via kubectl.
  #   2. Update helm/ecommerce-api/values-production.yaml image.tag to the desired SHA.
  #   3. Push the change — ArgoCD (production app, manual sync) shows an OutOfSync diff.
  #   4. Click Sync in ArgoCD UI to deploy. ArgoCD rolls back automatically on failure.
