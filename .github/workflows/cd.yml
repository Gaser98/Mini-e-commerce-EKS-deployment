name: CD — Staging then Production

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 776235864987.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPO: ecommerce-api
  EKS_CLUSTER: ecommerce-eks

permissions:
  id-token: write
  contents: read

jobs:
  # ── 1. Build and push (same pattern as CI) ────────────────────────────────
  build-push:
    name: Build and push
    runs-on: ubuntu-latest
    outputs:
      image-uri: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::776235864987:role/github-actions-ecommerce
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2. Deploy to staging ──────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to staging
    needs: build-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - run: curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
        shell: bash
      - uses: azure/setup-kubectl@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::776235864987:role/github-actions-ecommerce
          aws-region: ${{ env.AWS_REGION }}

      - name: Generate kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Ensure staging namespace
        run: kubectl create namespace staging --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to staging
        run: |
          cd k8s/overlays/staging
          kustomize edit set image \
            776235864987.dkr.ecr.us-east-1.amazonaws.com/ecommerce-api=${{ needs.build-push.outputs.image-uri }}
          kustomize build . | kubectl apply -n staging -f -

      - name: Wait for staging rollout
        run: kubectl rollout status deployment/ecommerce-api -n staging --timeout=180s

      - name: Run smoke tests against staging
        run: |
          STAGING_HOST=$(kubectl get svc ecommerce-api -n staging \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          # Wait for LB to propagate
          for i in $(seq 1 12); do
            curl -sf "http://${STAGING_HOST}/health/live" && break
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          curl -sf "http://${STAGING_HOST}/health/ready"

  # ── 3. Deploy to production (requires manual approval in GitHub UI) ────────
  deploy-production:
    name: Deploy to production
    needs: deploy-staging
    runs-on: ubuntu-latest
    # In GitHub: Settings > Environments > production > Required reviewers
    # The workflow pauses here until a reviewer approves in the GitHub UI.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - run: curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
        shell: bash
      - uses: azure/setup-kubectl@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::776235864987:role/github-actions-ecommerce
          aws-region: ${{ env.AWS_REGION }}

      - name: Generate kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Ensure production namespace
        run: kubectl create namespace production --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to production
        run: |
          cd k8s/overlays/production
          kustomize edit set image \
            776235864987.dkr.ecr.us-east-1.amazonaws.com/ecommerce-api=${{ needs.build-push.outputs.image-uri }}
          kustomize build . | kubectl apply -n production -f -

      - name: Wait for production rollout
        run: kubectl rollout status deployment/ecommerce-api -n production --timeout=300s

      - name: Verify production health
        run: |
          PROD_HOST=$(kubectl get svc ecommerce-api -n production \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          curl -sf "http://${PROD_HOST}/health/ready"
