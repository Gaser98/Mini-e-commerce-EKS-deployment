name: CD — Staging then Production

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 776235864987.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPO: ecommerce-api
  EKS_CLUSTER: ecommerce-eks

permissions:
  id-token: write
  contents: read

jobs:
  # ── 1. Build and push (same pattern as CI) ────────────────────────────────
  build-push:
    name: Build and push
    runs-on: ubuntu-latest
    outputs:
      image-uri: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::776235864987:role/github-actions-ecommerce
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2. Deploy to staging ──────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to staging
    needs: build-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4
      - uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::776235864987:role/github-actions-ecommerce
          aws-region: ${{ env.AWS_REGION }}

      - name: Generate kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Deploy to staging
        run: |
          helm upgrade --install ecommerce-api ./helm/ecommerce-api \
            --namespace staging \
            --create-namespace \
            --values helm/ecommerce-api/values-staging.yaml \
            --set image.tag=${{ github.sha }} \
            --wait \
            --atomic \
            --timeout 180s

      - name: Run smoke tests against staging
        run: |
          STAGING_HOST=$(kubectl get svc ecommerce-api-ecommerce-api -n staging \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          for i in $(seq 1 12); do
            curl -sf "http://${STAGING_HOST}/health/live" && break
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          curl -sf "http://${STAGING_HOST}/health/ready"

  # ── 3. Deploy to production (requires manual approval in GitHub UI) ────────
  deploy-production:
    name: Deploy to production
    needs: deploy-staging
    runs-on: ubuntu-latest
    # In GitHub: Settings > Environments > production > Required reviewers
    # The workflow pauses here until a reviewer approves in the GitHub UI.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4
      - uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::776235864987:role/github-actions-ecommerce
          aws-region: ${{ env.AWS_REGION }}

      - name: Generate kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Deploy to production
        run: |
          helm upgrade --install ecommerce-api ./helm/ecommerce-api \
            --namespace production \
            --create-namespace \
            --values helm/ecommerce-api/values-production.yaml \
            --set image.tag=${{ github.sha }} \
            --wait \
            --atomic \
            --timeout 300s

      - name: Verify production health
        run: |
          PROD_HOST=$(kubectl get svc ecommerce-api-ecommerce-api -n production \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          curl -sf "http://${PROD_HOST}/health/ready"
